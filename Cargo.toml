[workspace]
members = ["crates/candidates", "crates/inference", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["assembledev"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boxcars = "0.11.3"
subtr-actor = { git = "https://github.com/rlrml/subtr-actor", rev = "40ec533da4184e46418b742804818a326b50b489" }
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24"] }
