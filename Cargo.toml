[workspace]
members = ["crates/candidates", "crates/inference", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["assembledev"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
boxcars = "0.12.0"
subtr-actor = { git = "https://github.com/rlrml/subtr-actor", rev = "de36d0683f9c3fd1b4c8318f79537e636b51307a" }
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-24"] }
