[project]
name = "rl-mistake-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pyarrow>=21", "onnx>=1.18,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]
notebooks = ["ipykernel>=6,<8", "jupyterlab>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
