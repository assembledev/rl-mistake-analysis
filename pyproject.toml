[project]
name = "rl-mistake-analysis"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pyarrow>=21", "onnx>=1.18,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]
notebooks = ["ipykernel>=6,<8", "jupyterlab>=4,<5"]
training = [
  "catboost>=1.2.8,<2",
  "interpret-core==0.7.8",
  "joblib>=1.6,<2",
  "scikit-learn>=1.6,<2",
  "onnxruntime>=1.24,<2",
  "xgboost==3.4.1",
  "onnxmltools>=1.16,<2",
  "skl2onnx>=1.20,<2",
]
tracking = ["mlflow>=3.11,<4", "pip>=25,<27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
